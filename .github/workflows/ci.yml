name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate catalog.json
        run: python -c "import json; json.load(open('catalog.json')); print('catalog.json OK')"
      - name: Compile fix.py
        run: python -m py_compile scripts/fix.py
      - name: fix list
        run: python scripts/fix.py list
      - name: fix check node-version-too-old (node 20+ preinstalled on runner)
        run: python scripts/fix.py check node-version-too-old
      - name: importable API smoke test
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, 'scripts')
          from fix import load_catalog, check_issue
          cat = load_catalog()
          print('issues:', len(cat['issues']))
          assert len(cat['issues']) >= 5
          EOF
