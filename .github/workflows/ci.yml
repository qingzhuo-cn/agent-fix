name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15-intel]
        python: ["3.8", "3.11"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Validate catalog ownership
        shell: python
        run: |
          import json
          from pathlib import Path
          catalog = json.loads(Path("catalog.json").read_text(encoding="utf-8"))
          agents = set(catalog["agents"])
          assert len(agents) >= 15, len(agents)
          for issue in catalog["issues"]:
              targets = issue.get("agents", [])
              assert targets, issue["id"]
              for target in targets:
                  assert target == "all" or target in agents, (issue["id"], target)
              expanded = agents if "all" in targets else set(targets)
              for target in expanded:
                  applicable = []
                  for step in issue.get("checks", []):
                      step_agents = step.get("agents", [])
                      if not step_agents or "all" in step_agents or target in step_agents:
                          applicable.append(step)
                  assert applicable, (issue["id"], target, "has no scoped diagnostic step")
              if issue.get("doc"):
                  assert (Path("fixes") / Path(issue["doc"]).name).is_file(), issue["doc"]
          print(f"catalog.json OK: {len(agents)} agents, {len(catalog['issues'])} issues")
      - name: Validate persistence ownership
        shell: python
        run: |
          from pathlib import Path
          engine_source = Path("agentfix/engine.py").read_text(encoding="utf-8")
          state_source = Path("agentfix/state.py").read_text(encoding="utf-8")
          hooks_source = Path("agentfix/hooks.py").read_text(encoding="utf-8")
          result_source = Path("agentfix/result.py").read_text(encoding="utf-8")
          assert "zipfile" not in engine_source, "engine must not own archive persistence"
          assert state_source.count("def create_zip_atomic") == 1
          assert state_source.count("def atomic_write_text") == 1
          assert "zipfile" not in hooks_source, "hooks must delegate persistence to state.py"
          assert "not mcp-capable" not in result_source, "adapter status must not infer from human text"
          assert "class StatusText" in result_source
          print("persistence/status owner OK")
      - name: Compile the package
        shell: python
        run: |
          from pathlib import Path
          import py_compile
          files = [Path("scripts/fix.py"), Path("mcp/server.py"), Path("mcp/smoke_test.py")]
          files += list(Path("agentfix").glob("*.py")) + list(Path("tests").glob("*.py"))
          for path in files:
              py_compile.compile(str(path), doraise=True)
      - name: Unit tests
        env:
          TMPDIR: ${{ runner.temp }}
        run: python -m unittest discover -s tests -v
      - name: CLI surface
        shell: python
        run: |
          import subprocess
          import sys
          assert subprocess.run([sys.executable, "scripts/fix.py", "list"], check=True).returncode == 0
          assert subprocess.run([sys.executable, "scripts/fix.py", "agents"], check=True).returncode == 0
          # --agent is a per-subcommand flag, so it is asserted on the
          # subcommand surface rather than the top-level usage line.
          check_help = subprocess.check_output([sys.executable, "scripts/fix.py", "check", "--help"], text=True)
          assert "--agent" in check_help, check_help
          # Explicit targeting stays mandatory: omitting it is a usage error.
          failed = subprocess.run([sys.executable, "scripts/fix.py", "check", "node-version-too-old"], text=True, capture_output=True)
          assert failed.returncode != 0
          assert "--agent" in (failed.stdout + failed.stderr)
          # A real user status must produce a defined exit code (0 healthy,
          # 1 FAIL/INCONCLUSIVE, 2 target error) rather than crashing. Which one
          # depends on which agents exist on the runner, so assert the set.
          checked = subprocess.run(
              [sys.executable, "scripts/fix.py", "check", "node-version-too-old", "--agent", "claude-code"],
              text=True,
              capture_output=True,
          )
          assert checked.returncode in (0, 1, 2), (checked.returncode, checked.stdout, checked.stderr)
      - name: MCP registry and notification discipline
        shell: python
        run: |
          import json, subprocess, sys
          reqs = [
              {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}},
              {"jsonrpc":"2.0","method":"notifications/initialized"},
              {"jsonrpc":"2.0","id":2,"method":"tools/list"},
          ]
          p = subprocess.run([sys.executable, "mcp/server.py"], input="\n".join(json.dumps(r) for r in reqs), capture_output=True, text=True, timeout=60)
          assert p.returncode == 0, p.stderr
          replies = [json.loads(line) for line in p.stdout.splitlines() if line.strip()]
          assert len(replies) == 2, replies
          assert replies[0]["result"]["serverInfo"]["name"] == "agent-fix"
          tools = {tool["name"]: tool for tool in replies[1]["result"]["tools"]}
          expected = {"check", "apply", "info", "agents", "versions", "net", "logs", "audit", "backup", "restore", "provider", "hooks"}
          assert set(tools) == expected, set(tools) ^ expected
          assert tools["check"]["inputSchema"]["additionalProperties"] is False
          assert "agent_id" in tools["check"]["inputSchema"]["properties"]
          assert "agent_id" in tools["apply"]["inputSchema"]["properties"]
          print("MCP registry OK: 12 targeted tools")
      - name: MCP targeted regression harness
        env:
          TMPDIR: ${{ runner.temp }}
        run: python mcp/smoke_test.py
